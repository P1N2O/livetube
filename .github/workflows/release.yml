name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Test
        run: cargo test --release

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: Build (${{ matrix.outfile }})
    runs-on: ${{ matrix.os }}
    needs: test

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: static musl via cargo-zigbuild (cross from ubuntu)
          - target: x86_64-unknown-linux-musl
            outfile: livetube-linux-x64
            os: ubuntu-latest
            exe: ""
            toolchain: zigbuild
          - target: aarch64-unknown-linux-musl
            outfile: livetube-linux-arm64
            os: ubuntu-latest
            exe: ""
            toolchain: zigbuild
          # macOS: native build on an Apple Silicon runner (same SDK for both)
          - target: x86_64-apple-darwin
            outfile: livetube-macos-x64
            os: macos-14
            exe: ""
            toolchain: native
          - target: aarch64-apple-darwin
            outfile: livetube-macos-arm64
            os: macos-14
            exe: ""
            toolchain: native
          # Windows: native MSVC build
          - target: x86_64-pc-windows-msvc
            outfile: livetube-windows-x64.exe
            os: windows-latest
            exe: ".exe"
            toolchain: native

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Zig
        if: matrix.toolchain == 'zigbuild'
        uses: goto-bus-stop/setup-zig@v2

      - name: Install cargo-zigbuild
        if: matrix.toolchain == 'zigbuild'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build binary
        run: |
          if [ "${{ matrix.toolchain }}" = "zigbuild" ]; then
            cargo zigbuild --release --target ${{ matrix.target }} --bin livetube
          else
            cargo build --release --target ${{ matrix.target }} --bin livetube
          fi
          cp target/${{ matrix.target }}/release/livetube${{ matrix.exe }} ${{ matrix.outfile }}
        shell: bash

      - name: Install UPX
        if: runner.os == 'Linux'
        run: |
          set -e
          # Detect architecture
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) UPX_ARCH="amd64_linux" ;;
            aarch64|arm64) UPX_ARCH="arm64_linux" ;;
            *)
              echo "Unsupported architecture: $ARCH"
              exit 1
              ;;
          esac

          # Get latest release tag
          VERSION=$(curl -s https://api.github.com/repos/upx/upx/releases/latest | grep '"tag_name"' | cut -d '"' -f4)
          URL="https://github.com/upx/upx/releases/download/${VERSION}/upx-${VERSION#v}-${UPX_ARCH}.tar.xz"

          echo "Downloading UPX $VERSION for $ARCH"
          curl -L "$URL" -o upx.tar.xz
          tar -xf upx.tar.xz

          sudo mv upx-*/upx /usr/local/bin/upx

          upx --version

      - name: Compress binary with UPX
        if: runner.os == 'Linux'
        run: |
          upx --best --lzma "${{ matrix.outfile }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.outfile }}
          path: ${{ matrix.outfile }}
          retention-days: 1

  docker:
    name: Build & Push Docker image (linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Linux only (amd64 + arm64)
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build, docker]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          pattern: livetube-*

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: LiveTube ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
