services:
  livetube:
    build: .
    image: ghcr.io/p1n2o/livetube:latest
    container_name: livetube
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      # Shared cache root: yt-dlp web cache + persistent redb database
      CACHE_DIR: /home/livetube/.cache/livetube
    volumes:
      # Persist the cache across restarts/recreates
      - livetube-cache:/home/livetube/.cache/livetube

volumes:
  livetube-cache:
